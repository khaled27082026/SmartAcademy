<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الطالب | Smart Academy</title>
    <meta name="description" content="تسجيل دخول الطالب في منصة سمارت أكاديمي">

    <script>
        (function () {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0a425b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../assets/images/smart123.jpg">

    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.1.0 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.rtl.min.css">

    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .student-login-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-block: 16px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass);
        }

        [data-theme="light"] .student-login-header {
            background: rgba(244, 247, 249, 0.9);
        }

        #student-id {
            direction: rtl;
            text-align: right;
        }
    </style>
</head>
<body>

    <header class="student-login-header">
        <button class="theme-toggle" aria-label="تبديل الوضع الليلي/النهاري">
            <i class="fa-solid fa-sun icon-sun"></i>
            <i class="fa-solid fa-moon icon-moon"></i>
        </button>
    </header>

    <main class="auth-main">
        <div class="auth-glow"></div>
        <div class="container d-flex justify-content-center">
            <div class="auth-card">
                <div class="auth-head">
                    <img src="../assets/images/SMART%20ACADEMY.png" alt="سمارت أكاديمي" class="auth-logo-img">
                    <h1>دخول الطالب</h1>
                    <p>سجّل الدخول لمتابعة جدول حصصك المباشرة</p>
                </div>

                <form id="student-login-form">
                    <div class="form-field">
                        <label for="student-id">رقم الهاتف</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="student-id" name="student-id" placeholder="أدخل رقم الهاتف" autocomplete="tel" inputmode="numeric">
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="student-code">كلمة المرور</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="student-code" name="student-code" placeholder="أدخل كلمة المرور" autocomplete="current-password">
                        </div>
                    </div>

                    <p id="student-login-error" style="color: var(--logout-red); font-size: 0.9rem; margin-bottom: 16px; display: none;"></p>

                    <button type="submit" class="btn-glow auth-submit">
                        دخول
                        <i class="fa-solid fa-arrow-right-to-bracket icon-rtl-flip"></i>
                    </button>
                </form>

                <a href="../index.html" class="auth-back"><i class="fa-solid fa-house"></i> عودة للصفحة الرئيسية</a>
            </div>
        </div>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>

    <script>
        document.getElementById('student-login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const phone = document.getElementById('student-id').value.trim();
            const password = document.getElementById('student-code').value;
            const errorEl = document.getElementById('student-login-error');

            let students = [];
            try {
                students = JSON.parse(localStorage.getItem('sa_students')) || [];
            } catch (err) {
                students = [];
            }

            const match = students.find(function (s) {
                return s.phone === phone && s.password === password;
            });

            if (match) {
                saSetSession('sa_current_student', match);
                window.location.href = '../student-dashboard.html';
                return;
            }

            errorEl.style.color = 'var(--logout-red)';
            errorEl.textContent = 'رقم الهاتف أو كلمة المرور غير صحيحة.';
            errorEl.style.display = 'block';
        });
    </script>
</body>
</html>
