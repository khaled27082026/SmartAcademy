<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الطالب | Smart Academy</title>
    <meta name="description" content="تسجيل دخول الطالب في منصة سمارت أكاديمي">

    <script>
        (function () {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <script>
        (function () {
            var key = 'sa_current_student';
            var stored = localStorage.getItem(key);
            if (!stored) return;

            var raw;
            try {
                raw = JSON.parse(stored);
            } catch (e) {
                localStorage.removeItem(key);
                return;
            }

            if (!raw || !raw.data || !raw.expiresAt || Date.now() > raw.expiresAt) {
                localStorage.removeItem(key);
                return;
            }

            window.location.replace('../student-dashboard.html');
        })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a425b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="سمارت — الطالب">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../assets/images/smart123.jpg">

    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.1.0 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.rtl.min.css">

    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .student-login-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-block: 16px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass);
        }

        [data-theme="light"] .student-login-header {
            background: rgba(244, 247, 249, 0.9);
        }

        #student-id {
            direction: rtl;
            text-align: right;
        }

        .student-install-btn.pwa-install-btn,
        .student-install-btn.pwa-install-btn.is-visible {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-block-start: 14px;
            padding: 10px 25px;
            border-radius: 50px;
        }

        html.sa-standalone .student-install-btn {
            display: none !important;
        }

        .student-install-hint {
            display: none;
            margin-block-start: 14px;
            padding: 14px 16px;
            border-radius: 15px;
            background: var(--glass);
            border: 1px solid var(--border-glass);
            color: var(--text-sec);
            text-align: start;
        }

        .student-install-hint.is-visible {
            display: block;
        }

        html.sa-standalone .student-install-hint {
            display: none !important;
        }

        .student-install-hint__title {
            margin: 0 0 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.6;
        }

        .student-install-hint__steps {
            margin: 0;
            padding: 0;
            list-style: none;
            counter-reset: ios-step;
        }

        .student-install-hint__steps li {
            position: relative;
            margin: 0;
            padding-block: 6px;
            padding-inline-start: 32px;
            font-size: 0.88rem;
            line-height: 1.7;
            counter-increment: ios-step;
        }

        .student-install-hint__steps li::before {
            content: counter(ios-step);
            position: absolute;
            inset-inline-start: 0;
            top: 7px;
            width: 22px;
            height: 22px;
            border-radius: 50px;
            background: var(--primary);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 22px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="student-login-header">
        <button class="theme-toggle" aria-label="تبديل الوضع الليلي/النهاري">
            <i class="fa-solid fa-sun icon-sun"></i>
            <i class="fa-solid fa-moon icon-moon"></i>
        </button>
    </header>

    <main class="auth-main">
        <div class="auth-glow"></div>
        <div class="container d-flex justify-content-center">
            <div class="auth-card">
                <div class="auth-head">
                    <img src="../assets/images/SMART%20ACADEMY.png" alt="سمارت أكاديمي" class="auth-logo-img">
                    <h1>دخول الطالب</h1>
                    <p>سجّل الدخول لمتابعة جدول حصصك المباشرة</p>
                </div>

                <form id="student-login-form">
                    <div class="form-field">
                        <label for="student-id">رقم الهاتف</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="student-id" name="student-id" placeholder="أدخل رقم الهاتف" autocomplete="tel" inputmode="numeric">
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="student-code">كلمة المرور</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="student-code" name="student-code" placeholder="أدخل كلمة المرور" autocomplete="current-password">
                        </div>
                    </div>

                    <p id="student-login-error" style="color: var(--logout-red); font-size: 0.9rem; margin-bottom: 16px; display: none;"></p>

                    <button type="submit" class="btn-glow auth-submit">
                        دخول
                        <i class="fa-solid fa-arrow-right-to-bracket icon-rtl-flip"></i>
                    </button>
                </form>

                <button type="button" class="btn-outline-glow student-install-btn pwa-install-btn" id="student-install-btn">
                    <i class="fa-solid fa-download"></i>
                    تحميل التطبيق
                </button>
                <div class="student-install-hint" id="student-install-hint">
                    <p class="student-install-hint__title">للتثبيت على الآيفون</p>
                    <ol class="student-install-hint__steps">
                        <li>افتح هذه الصفحة من سفاري.</li>
                        <li>اضغط زر المشاركة في الأسفل.</li>
                        <li>اختر «إضافة إلى الشاشة الرئيسية».</li>
                        <li>اضغط «إضافة».</li>
                    </ol>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabaseClient.js"></script>

    <script>
        (function () {
            var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            if (isStandalone) document.documentElement.classList.add('sa-standalone');

            var hint = document.getElementById('student-install-hint');
            var installBtn = document.getElementById('student-install-btn');
            var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (hint && isIos && !isStandalone) {
                hint.classList.add('is-visible');
            }

            if (!installBtn) return;

            installBtn.addEventListener('click', function () {
                if (isStandalone || !hint) return;
                hint.classList.add('is-visible');
                hint.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        })();

        document.getElementById('student-login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const phone = document.getElementById('student-id').value.trim();
            const password = document.getElementById('student-code').value;
            const errorEl = document.getElementById('student-login-error');
            const submitBtn = e.target.querySelector('.auth-submit');

            function showError(message) {
                errorEl.style.color = 'var(--logout-red)';
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            }

            if (!window.saSupabase) {
                showError('تعذّر الاتصال بقاعدة البيانات الآن، حاول مرة أخرى بعد قليل.');
                return;
            }

            errorEl.style.display = 'none';
            if (submitBtn) submitBtn.disabled = true;

            window.saSupabase
                .rpc('verify_student_login', { p_phone: phone, p_password: password })
                .then(function (res) {
                    if (submitBtn) submitBtn.disabled = false;

                    if (res.error) {
                        console.error('تعذّر التحقق من بيانات دخول الطالب:', res.error);
                        showError('تعذّر التحقق من بيانات الدخول، حاول مرة أخرى.');
                        return;
                    }

                    const match = res.data && res.data[0];
                    if (!match) {
                        showError('رقم الهاتف أو كلمة المرور غير صحيحة.');
                        return;
                    }

                    saSetSession('sa_current_student', {
                        id: match.id,
                        fullName: match.full_name,
                        phone: match.phone,
                        stage: match.stage,
                        parentPhone: match.parent_phone,
                        sessionPrice: match.session_price
                    });
                    window.location.href = '../student-dashboard.html';
                });
        });
    </script>
</body>
</html>
